<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แต่งตัวพระ – นาฏศิลป์ไทย</title>
<style>
:root{--bg:#2b2a33;--bg2:#4a4658;--ink:#f1ece2;--card:#3a3745;--line:#6b6679;--gold:#e0b030;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#efe6d4;--bg2:#fff7e6;--ink:#33210f;--card:#fffaf0;--line:#c9b27a;--gold:#b8860b}}
:root[data-theme="light"]{--bg:#efe6d4;--bg2:#fff7e6;--ink:#33210f;--card:#fffaf0;--line:#c9b27a;--gold:#b8860b}
html,body{height:100%;margin:0}
body{font-family:"Sarabun","Noto Sans Thai",Tahoma,sans-serif;color:var(--ink);background:radial-gradient(circle at 50% 40%,var(--bg2),var(--bg));display:flex;flex-direction:column;overflow:hidden}
#side{padding:8px 14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
#stars{font-size:24px;letter-spacing:2px;color:#f0b800}
#cnt{font-size:13px;opacity:.9}
#info{display:none;font-size:13px;line-height:1.5;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
#stage{flex:1;min-height:0;position:relative;display:flex;justify-content:center}
.shirt{fill:var(--shirt,#7a1f33)}.nung{fill:var(--nung,#1f6b4f)}
#ch{position:absolute;left:0;top:0;width:100%;height:100%;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35))}
#app g[id^=L_]{filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
#msg{position:absolute;left:8px;right:8px;bottom:4px;text-align:center;font-size:14px;font-weight:700;background:var(--card);border:2px solid var(--gold);border-radius:12px;padding:6px 10px;opacity:0;transition:opacity .25s;pointer-events:none}
#panel{background:var(--card);border-top:3px solid var(--gold);border-radius:16px 16px 0 0;height:38vh;display:flex;flex-direction:column}
#tabs{display:flex;gap:4px;padding:6px 6px 0}
#tabs button{flex:1;font:inherit;font-size:12px;color:var(--ink);background:transparent;border:0;border-bottom:3px solid transparent;padding:8px 2px;cursor:pointer}
#tabs button.on{border-color:var(--gold);font-weight:700}
#grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px;align-content:start}
.card{border:2px solid var(--line);border-radius:10px;padding:3px;text-align:center;font-size:11px;line-height:1.2;touch-action:none;user-select:none;cursor:grab;background:var(--bg2)}
.card svg{width:100%;height:60px;display:block}
.card.sel{border-color:#f0b800}
.ghost{position:fixed;z-index:9;width:78px;pointer-events:none;opacity:.92;transform:scale(1.1)}
#end{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(0,0,0,.65);color:#fff;font-size:22px;gap:12px;padding:20px}
#end button{font:inherit;color:#fff;background:transparent;border:2px solid #fff;border-radius:12px;padding:8px 18px}
@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:sk .3s}
#stp{position:absolute;top:6px;left:8px;right:8px;text-align:center;font-weight:700;font-size:14px;background:var(--card);border:2px solid var(--gold);border-radius:12px;padding:6px 10px;pointer-events:none}
#stp:empty{display:none}
#stage{background:radial-gradient(ellipse at 50% 30%,rgba(255,220,150,.22),transparent 65%)}
#flash{position:absolute;inset:0;background:rgba(220,30,30,.5);opacity:0;pointer-events:none;z-index:5}
#flash.on{animation:fl .55s}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
.card{box-shadow:0 2px 6px rgba(0,0,0,.25)}
.card:hover{border-color:var(--gold)}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
#ch.win{animation:gl 1s ease-in-out infinite alternate}
@keyframes gl{from{filter:drop-shadow(0 0 8px #ffd54a)}to{filter:drop-shadow(0 0 38px #ffe58a)}}
#end.win{background:rgba(20,10,0,.35)}
#end.win #endt{font-size:30px;font-weight:700;color:#ffd54a;text-shadow:0 0 18px #ff9d00;animation:bn .9s ease-out}
@keyframes bn{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
#mus{font-size:18px;background:transparent;border:1px solid var(--line);border-radius:10px;color:var(--ink);cursor:pointer;padding:2px 8px}
@media (min-width:800px){
 body{display:grid;grid-template-columns:220px 1fr 360px}
 #side{flex-direction:column;align-items:stretch;padding:16px}
 #info{display:block}
 #panel{height:auto;border-top:0;border-left:3px solid var(--gold);border-radius:0}
 #grid{grid-template-columns:repeat(3,1fr)}
}
</style></head>
<body>
<div id="side"><div id="stars"></div><button id="mus" onclick="toggleMus()">🔊</button><div id="cnt"></div><div id="info">ลากชุดจากรายการไปวางบนตัวละคร หรือแตะชุดแล้วแตะที่ตัวละคร</div></div>

<g transform="translate(112 92)"><g id="pow" style="opacity:0;transform-box:fill-box;transform-origin:center"><path d="M0 -34L8 -14L28 -22L18 -4L38 4L16 12L22 32L4 22L-8 36L-12 16L-32 20L-22 2L-38 -10L-16 -12Z" fill="#ffd21f" stroke="#e0302d" stroke-width="3"/><text y="6" text-anchor="middle" font-size="16" font-weight="900" fill="#e0302d" stroke="#fff" stroke-width=".6" font-family="Sarabun,Tahoma,sans-serif">ตุ้บ!</text></g></g>
</svg>
<canvas id="fx"></canvas><div id="flash"></div><div id="stp"></div><div id="msg"></div>
<div id="end"><div id="endt"></div><button onclick="location.reload()">เล่นใหม่</button></div>
</div>
<div id="panel"><div id="tabs"></div><div id="grid"></div></div>

let AC=null,out=null,mg=null,nextT=0,beat=0,musicOn=true;
function getAC(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();out=AC.createGain();out.gain.value=musicOn?1:0;out.connect(AC.destination)}catch(e){}}if(AC&&AC.state=='suspended')AC.resume();return AC}
function startMusic(){const a=getAC();if(!a||mg)return;mg=a.createGain();mg.gain.value=.6;mg.connect(out);

 const lf=a.createOscillator(),lg=a.createGain();lf.frequency.value=.2;lg.gain.value=160;lf.connect(lg);lg.connect(lp.frequency);lf.start();

 nextT=a.currentTime+.2;setInterval(sched,100)}
function note(f,t,d,v,ty){const o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.02)}
function sched(){if(!AC||done)return;const gap=60/(62+(5-stars)*20);
 while(nextT<AC.currentTime+.3){const t=nextT,o=AC.createOscillator(),g=AC.createGain();
  o.frequency.setValueAtTime(95,t);o.frequency.exponentialRampToValueAtTime(38,t+.13);g.gain.setValueAtTime(.7,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g);g.connect(mg);o.start(t);o.stop(t+.22);
  note(70,t+.17,.14,.4);
  if(stars<=3)note(1800,t+gap/2,.03,.05,'square');
  if(beat%4==0)note(stars<=2?622:466,t,gap*3,.05);
  if(beat%8==4)note(stars<=2?330:392,t,gap*2,.04,'triangle');
  beat++;nextT+=gap}}
function stopMusic(){if(mg)mg.gain.setTargetAtTime(0,AC.currentTime,.3)}
function fan(ns){const a=getAC();if(!a)return;ns.forEach((f,i)=>{const t=a.currentTime+i*.16,o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.45);o.connect(g);g.connect(out);o.start(t);o.stop(t+.5)})}

function celebrate(){const cv=$('fx'),c=cv.getContext('2d'),D=devicePixelRatio||1,W=cv.width=cv.clientWidth*D,H=cv.height=cv.clientHeight*D,P=[],cols=['#ffd54a','#ff4d5e','#4d8dff','#ffffff','#7be08a','#ff9ad5'];
 const f=$('flash');f.style.background='rgba(255,250,210,.95)';f.classList.remove('on');void f.offsetWidth;f.classList.add('on');setTimeout(()=>f.style.background='',700);
 ch.classList.add('win');ch.animate([{transform:'scale(1)'},{transform:'scale(1.06)'},{transform:'scale(1)'}],{duration:700,iterations:4});
 const conf=y=>({k:0,x:Math.random()*W,y,vx:(Math.random()-.5)*2*D,vy:(2+Math.random()*3)*D,r:Math.random()*6,vr:(Math.random()-.5)*.3,w:(6+Math.random()*6)*D,h:(3+Math.random()*4)*D,c:cols[Math.random()*6|0],l:1});
 for(let i=0;i<150;i++)P.push(conf(-Math.random()*H*.6));
 const burst=()=>{const x=W*(.15+Math.random()*.7),y=H*(.12+Math.random()*.35),c0=cols[Math.random()*6|0];pop();for(let i=0;i<48;i++){const a=i/48*6.283,s=(2+Math.random()*4)*D;P.push({k:1,x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,c:c0,l:1})}for(let i=0;i<10;i++)P.push(conf(-10))};
 const t0=performance.now();let nb=0;
 (function loop(now){const el=now-t0;c.clearRect(0,0,W,H);
  if(el>nb&&el<9000){burst();nb=el+450+Math.random()*350}
  P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.k){p.vy+=.06*D;p.vx*=.985;p.l-=.012;c.globalAlpha=Math.max(p.l,0);c.fillStyle=p.c;c.beginPath();c.arc(p.x,p.y,2.4*D,0,6.283);c.fill()}else{p.r+=p.vr;if(el>8000)p.l-=.01;c.globalAlpha=Math.max(p.l,0);c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;c.fillRect(-p.w/2,-p.h/2,p.w,p.h);c.restore()}});
  c.globalAlpha=1;for(let i=P.length-1;i>=0;i--)if(P[i].l<=0||P[i].y>H+40)P.splice(i,1);
  if(el<12000||P.length)requestAnimationFrame(loop);else c.clearRect(0,0,W,H)})(t0)}
